# XcodeGen spec. Regenerate the Xcode project after adding or removing files:
#   cd ios && xcodegen generate
name: SorghumCapture
options:
  bundleIdPrefix: com.sorghum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your team in Xcode (Signing & Capabilities) to run on a physical iPhone.
    CODE_SIGN_STYLE: Automatic
targets:
  SorghumCapture:
    type: application
    platform: iOS
    sources: [SorghumCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sorghum.capture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sorghum Capture
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access is needed to photograph samples.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  SorghumCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SorghumCaptureTests]
    dependencies:
      - target: SorghumCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SorghumCapture.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SorghumCapture
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SorghumCapture:
    build:
      targets:
        SorghumCapture: all
    test:
      targets: [SorghumCaptureTests]
