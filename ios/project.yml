# XcodeGen spec. Regenerate the Xcode project after adding or removing files, then install
# the pods (TensorFlow Lite) and open the workspace, not the project:
#   cd ios && xcodegen generate && pod install && open SorghumCapture.xcworkspace
#
# Species model: the only place for versioned model files is SorghumCapture/Resources/Models/.
# The real traits-vN.tflite and traits-vN.json are to be committed there (plain git, about
# 1-2 MB) once traits-v1 exists, so every checkout bundles the model and the R7 parity test
# runs. Install an export with
#   ios/scripts/install-species-model.sh <export-dir>
# which checks that traits-vN.tflite and traits-vN.json share N, replaces the old version and
# regenerates the project. The app loads the highest N it finds (BundledSpeciesModel).
# Parity fixtures are read from shared/src/commonTest/resources/species/ (SpeciesModelParityTests).
name: SorghumCapture
options:
  bundleIdPrefix: com.sorghum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your team in Xcode (Signing & Capabilities) to run on a physical iPhone.
    CODE_SIGN_STYLE: Automatic
targets:
  SorghumCapture:
    type: application
    platform: iOS
    sources:
      - path: SorghumCapture
        # "._*" files are macOS metadata written on exFAT drives; they must never reach the bundle.
        # Models are added below, so only Resources/Models bundles versioned model files; a
        # traits-v* file anywhere else in the app sources is never bundled.
        excludes: ["**/._*", "**/traits-v*", "Resources/Models"]
      - path: SorghumCapture/Resources/Models
        buildPhase: resources
        includes: ["traits-v*.tflite", "traits-v*.json"]
        # Missing until traits-v1 is committed; the app then runs without the species check.
        optional: true
    preBuildScripts:
      # Builds the shared Kotlin core (shared/) as Shared.framework for the current SDK and
      # configuration. Gradle needs a JDK; Xcode does not inherit the shell's JAVA_HOME.
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        # $(inherited) keeps the CocoaPods settings (TensorFlow Lite) alongside ours.
        FRAMEWORK_SEARCH_PATHS: [$(inherited), $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)]
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
        # The Gradle build phase writes outside the Xcode sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sorghum.capture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sorghum Capture
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access is needed to photograph samples.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  SorghumCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SorghumCaptureTests
        excludes: ["**/._*"]
      # Parity fixtures written by the model export (expected.json + input-size PNGs). Copied as
      # a "species" folder; SpeciesModelParityTests skips while it holds no expected.json. The
      # folder is kept in git (.gitkeep) because Xcode fails on a missing folder reference.
      - path: ../shared/src/commonTest/resources/species
        type: folder
        buildPhase: resources
    dependencies:
      - target: SorghumCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: [$(inherited), $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)]
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SorghumCapture.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SorghumCapture
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SorghumCapture:
    build:
      targets:
        SorghumCapture: all
    test:
      targets: [SorghumCaptureTests]
